version: 1.0.0
facts:
  - id: character:adeline:금지된 힘
    subject:
      kind: character
      id: adeline
    key: 금지된 힘
    value: 사물과 사람에 깃든 저주·맹세를 은빛 실로 보고, 실의 매듭을 늦추거나 되묶을 수 있으나 끊으면 반동한다
    status: canon
  - id: character:adeline:힘의 대가
    subject:
      kind: character
      id: adeline
    key: 힘의 대가
    value: 실을 다룰 때마다 손끝이 얼고, 힘의 사용이 알려지면 황실 종교청의 이단 지정 사유가 된다
    status: canon
  - id: character:adeline:계약 결혼 사유
    subject:
      kind: character
      id: adeline
    key: 계약 결혼 사유
    value: 로제 백작가의 빚 전액을 발테인 대공가가 대신 갚는 조건으로 1년 계약 결혼에 서명했다
    status: canon
  - id: character:kaiden:겨울 저주
    subject:
      kind: character
      id: kaiden
    key: 겨울 저주
    value: 첫눈부터 해빙까지 심장이 얼어붙는 발작이 오고, 겨울을 넘길 때마다 감정이 한 겹씩 지워진다
    status: canon
  - id: character:kaiden:계약 준수
    subject:
      kind: character
      id: kaiden
    key: 계약 준수
    value: 서명한 계약 조항은 손해를 보더라도 끝까지 지키며, 조항 수정은 두 사람의 합의 서명으로만 한다
    status: canon
  - id: character:graham:침묵의 서약
    subject:
      kind: character
      id: graham
    key: 침묵의 서약
    value: 집사가는 대공가에 침묵의 서약으로 묶여 있으며, 3대에 걸친 저주 기록을 서재의 잠긴 서랍에 봉해 왔다
    status: canon
  - id: character:bianca:은폐 동기
    subject:
      kind: character
      id: bianca
    key: 은폐 동기
    value: 겨울 저주의 근원인 첫 맹세를 황실이 만들었다는 사실을 감추기 위해 이단 지정과 군사 동원까지 불사한다
    status: canon
  - id: character:roen:첫 아군
    subject:
      kind: character
      id: roen
    key: 첫 아군
    value: 계약 청약서를 전달한 사절이자 카이든의 발작 주기를 곁에서 세어 온 유일한 친우로, 아델라인의 첫 아군이 된다
    status: canon
  - id: character:cecilia:공모의 대가
    subject:
      kind: character
      id: cecilia
    key: 공모의 대가
    value: 아델라인을 계약 결혼의 담보로 밀어냈고 비앙카의 이간에 가담한 대가로 3막에서 가문의 몰락과 함께 죄를 진술하게 된다
    status: canon
  - id: background:first-oath:저주의 기원
    subject:
      kind: background
      id: first-oath
    key: 저주의 기원
    value: 건국 첫 겨울 황실이 발테인의 건국 공로를 지우려 충성 서약을 저주로 뒤틀었고, 문서 원본은 황실 금고에 보관되었다
    status: canon
  - id: background:sealed-crypt:서약 문자
    subject:
      kind: background
      id: sealed-crypt
    key: 서약 문자
    value: 봉인실 벽의 옛 서약 문자는 실을 보는 자에게만 은빛으로 읽히며, 성 안의 모든 저주의 실이 이곳으로 모인다
    status: canon
  - id: background:castle-glasshouse:겨울장미
    subject:
      kind: background
      id: castle-glasshouse
    key: 겨울장미
    value: 시들지 않는 겨울장미는 선대 대공비가 아들의 저주를 나눠 받으려 실을 옮겨 둔 그릇으로, 저주가 풀리면 비로소 시든다
    status: canon
  - id: background:north-snowfield:서약지 규칙
    subject:
      kind: background
      id: north-snowfield
    key: 서약지 규칙
    value: 설원의 옛 서약지는 첫 맹세가 맺어진 자리로, 이곳에서만 맹세를 되묻거나 되묶을 수 있고 원본을 밖에서 태우면 저주가 폭주한다
    status: canon
  - id: character:adeline:계약서 제7항
    subject:
      kind: character
      id: adeline
    key: 계약서 제7항
    value: 계약서 제7항은 '서로의 비밀을 묻지 않는다'로, 3장에서 저주 조사에 한한 예외가 덧붙고 7장 결전 전야에 합의로 폐지된다
    status: canon
  - id: character:kaiden:해빙의 징표
    subject:
      kind: character
      id: kaiden
    key: 해빙의 징표
    value: 아델라인이 실의 매듭을 늦출 때마다 손끝의 온기가 돌아오며, 저주 해제 후 감정이 서서히 회복된다
    status: canon
